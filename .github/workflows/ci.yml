name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and select Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install locked dependencies and packaged project
        run: uv sync --locked --no-editable

      - name: Run all tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q src tests examples scripts

      - name: Build wheel
        run: uv build --wheel

      - name: Exercise installed CLI without ComfyUI
        run: uv run --no-sync python scripts/smoke_cli.py
